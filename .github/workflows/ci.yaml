name: ci-nodejs-workflow
on: 
  pull_request:
    branches:
      - develop
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24.21.0']
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          # token: ${{ secrets.GITHUB_TOKEN }}
          node-version:  ${{ matrix.node }}    
      - run: npm install     
      - run: npm test
      - run: npm run start