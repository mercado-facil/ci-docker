name: ci-nodejs-workflow
on: 
  pull_request:
    branches:
      - develop
jobs:
  ckeck-application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - run: npm install
      - run: npm test
      - run: npm run start